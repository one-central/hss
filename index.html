<div class="container" id="postit-container"></div>

<script>

인근 5,800세대 주민들의 중심지 역할을 하는 공간으로

 2. 다양한 세대 계층이 사용할수 있어야 하며,

중앙동 주민들의 복지 요구에 성남시가 답해야 합니다!!
주민 간담회를 통해 중앙동 주민들의 의견을 수렴해 주시기 바랍니다!!`
        },
        {
            type: "underground", // 전선지중화
            content: `[전선 지중화 주민 민원]
중앙동 하늘채·힐스테이트·해링턴 일대는 전선 지중화가 이루어지지 않아, 공동주택에서 정전 사고 및 전기 설비 파손 피해가 반복적으로 발생하고 있습니다.
전기 사고로 인해 수많은 세대가 불편을 겪고 있으며, 주민 안전까지 위협받는 상황입니다.

성남시가 중앙동 주민을 더 이상 외면하지 않는다면, 공동주택 밀집 지역인 중앙동에 대해 즉각적인 전선 지중화 대책을 마련해야 합니다.

주민의 안전과 생활권 보호를 위해 조속한 조치를 강력히 요구합니다.`
        },
        {
            type: "underground", // 전선지중화
            content: `[전선 지중화 관련 주민 민원]
중앙동 하늘채·힐스테이트·해링턴 일대는 제일초등학교의 주요 통학로입니다.
초등학교 인근은 아이들의 안전을 위해 전선 지중화를 최우선적으로 추진해야 하는 구역입니다.

그럼에도 불구하고, 해당 구간은 여전히 전신주와 노출된 전선으로 인해, 어린이 보행 안전과 도시 미관에 심각한 문제를 초래하고 있습니다.

성남시는 더 이상 지체하지 말고, 제일초 인근 통학로에 대한 전선 지중화 대책을 조속히 마련하시기 바랍니다.`
        },
        {

            content: `[성호시장 재개발 요청]

        },
        {
            type: "welfare", // 복지시설부지
            content: `[중앙동 3004번지 물놀이 공원 요청]
중앙동 3004번지 공원은 인근 5800세대 아파트의 어린이와 학생이 접근하기 좋은 공원입니다.

성남시의 자랑인 물놀이 공원은 중앙동에는 하나도 운영되지 않고 있으며
3004번지 공원은 제일초옆에 있어 학부모들이 안심할고 사용할수 있는 공간입니다.

물놀이 공원이 운영된다면 주변의 많은 어린이와 학생들이 이용할수 있는 좋은 복지 시설이 될 것입니다.

성남시에서는 다음과 같이 진행해주시기 바랍니다.
 1. 내년 여름에 이동식 물놀이 시설을 운영해주시기 바랍니다.
 2. 공원의 어린이 놀이터를 장기적으로 물놀이 공원으로 변경해 주시기 바랍니다.`
        }
    ];

    // Fisher-Yates 셔플 함수
    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    // 각 그룹 랜덤 + 번갈아 배치
    function alternateMixByTypeAndShuffle(arr) {
        const welfareArr = shuffle(arr.filter(c => c.type === "welfare"));
        const undergroundArr = shuffle(arr.filter(c => c.type === "underground"));
        let i = 0, j = 0, result = [];
        let flag = true; // true = welfare, false = underground

        // 번갈아가며 추가
        while (i < welfareArr.length && j < undergroundArr.length) {
            if (flag) {
                result.push(welfareArr[i++]);
            } else {
                result.push(undergroundArr[j++]);
            }
            flag = !flag;
        }
        // 남은 것 뒤에 추가
        while (i < welfareArr.length) result.push(welfareArr[i++]);
        while (j < undergroundArr.length) result.push(undergroundArr[j++]);
        return result;
    }

    // 화면에 포스트잇 생성 및 기능 부여
    function renderPostIts() {
        const container = document.getElementById('postit-container');
        container.innerHTML = '';
        const postits = alternateMixByTypeAndShuffle(complaints);
        postits.forEach((item) => {
            const div = document.createElement('div');
            div.className = 'postit ' + (item.type === "welfare" ? "welfare" : "underground");
            div.setAttribute('data-content', item.content);
            div.innerText = item.content;

            // 클릭시 복사
            div.addEventListener('click', function() {
                copyToClipboard(item.content);
            });
            // 더블클릭시 SMS
            div.addEventListener('dblclick', function() {
                if (isMobile()) {
                    const smsLink = `sms:01059200184?&body=${encodeURIComponent(item.content)}`;
                    window.location.href = smsLink;
                }
            });
            // 롱터치시 SMS
            div.addEventListener('touchstart', function(e) {
                this.longPressTimer = setTimeout(() => {
                    if (isMobile()) {
                        const smsLink = `sms:01059200184?&body=${encodeURIComponent(item.content)}`;
                        window.location.href = smsLink;
                    }
                }, 800);
            });
            div.addEventListener('touchend', function(e) {
                clearTimeout(this.longPressTimer);
            });

            container.appendChild(div);
        });
    }

    // 모바일 감지
    function isMobile() {
        return /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }
    // 클립보드 복사
    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            // 복사 완료시 추가 동작 X
        }).catch(err => {
            console.error('복사에 실패했습니다.', err);
        });
    }

    window.onload = renderPostIts;
</script>
