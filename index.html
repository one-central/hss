<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중앙동-성남시 민원문자 010-5920-0184</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background-color: #f5f5f5;
            height: 100vh;
            margin: 0;
        }
        h1 {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 20px;
            width: 100%;
            font-size: 24px;
        }
        a {
            color: inherit;
            text-decoration: none;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            width: 80%;
            max-width: 1200px;
        }
        .postit {
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: transform 0.2s;
            font-size: 16px;
            min-height: 160px;
            display: flex;
            align-items: center;
            background-color: #fff;
            border: 1px solid #eee;
        }
        .postit:hover {
            transform: scale(1.05);
        }
        .postit:active {
            transform: scale(1.09);
        }
        .welfare {
            background-color: #fff9db !important; /* 연한 노란색 */
            border-color: #ffe28b;
        }
        .underground {
            background-color: #e5f7e9 !important; /* 연한 녹색 */
            border-color: #b3e3c0;
        }
        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 20px;
            }
            .postit {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

<h1>[▼더블클릭] 성남시 민원문자 <br> 010-5920-0184</h1>

<div class="container" id="postit-container"></div>

<script>
    // 민원 데이터
    const complaints = [
        {
            type: "welfare", // 복지시설부지
            content: `성호시장 4거리는 중고등학생 및 인근아파트 주민들의 보행과 차량통행이 많은 곳입니다. 

신호위반 과속 차량으로인해 주민들이 사거리 이용시 놀라는 경우가 생기고 있습니다.

광명로 성호시장 방면에서 하늘채 1단지 방향으로 후방 과속 카메라를 설치해주시면 횡단보도 주변 사고 위험도 줄이고 야간의 오토바이 소음도 줄일수 있을것 입니다.

성호시장 4거리에 신호위반 과속 방지 후방 카메라 설치 바랍니다.`
        },
        {
            type: "underground", // 전선지중화
            content: `성호시장 사거리 앞 8번 버스 과속 신호위반 운행 금지해주세요!!

많은 주민과 학생들이 이동하는 곳에서 과속운전 금지해주세요!!`
        }
    ];

    // Fisher-Yates 셔플 함수
    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    // 각 그룹 랜덤 + 번갈아 배치
    function alternateMixByTypeAndShuffle(arr) {
        const welfareArr = shuffle(arr.filter(c => c.type === "welfare"));
        const undergroundArr = shuffle(arr.filter(c => c.type === "underground"));
        let i = 0, j = 0, result = [];
        let flag = true; // true = welfare, false = underground

        // 번갈아가며 추가
        while (i < welfareArr.length && j < undergroundArr.length) {
            if (flag) {
                result.push(welfareArr[i++]);
            } else {
                result.push(undergroundArr[j++]);
            }
            flag = !flag;
        }
        // 남은 것 뒤에 추가
        while (i < welfareArr.length) result.push(welfareArr[i++]);
        while (j < undergroundArr.length) result.push(undergroundArr[j++]);
        return result;
    }

    // 화면에 포스트잇 생성 및 기능 부여
    function renderPostIts() {
        const container = document.getElementById('postit-container');
        container.innerHTML = '';
        const postits = alternateMixByTypeAndShuffle(complaints);
        postits.forEach((item) => {
            const div = document.createElement('div');
            div.className = 'postit ' + (item.type === "welfare" ? "welfare" : "underground");
            div.setAttribute('data-content', item.content);
            div.innerText = item.content;

            // 클릭시 복사
            div.addEventListener('click', function() {
                copyToClipboard(item.content);
            });
            // 더블클릭시 SMS
            div.addEventListener('dblclick', function() {
                if (isMobile()) {
                    const smsLink = `sms:01059200184?&body=${encodeURIComponent(item.content)}`;
                    window.location.href = smsLink;
                }
            });
            // 롱터치시 SMS
            div.addEventListener('touchstart', function(e) {
                this.longPressTimer = setTimeout(() => {
                    if (isMobile()) {
                        const smsLink = `sms:01059200184?&body=${encodeURIComponent(item.content)}`;
                        window.location.href = smsLink;
                    }
                }, 800);
            });
            div.addEventListener('touchend', function(e) {
                clearTimeout(this.longPressTimer);
            });

            container.appendChild(div);
        });
    }

    // 모바일 감지
    function isMobile() {
        return /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }
    // 클립보드 복사
    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            // 복사 완료시 추가 동작 X
        }).catch(err => {
            console.error('복사에 실패했습니다.', err);
        });
    }

    window.onload = renderPostIts;
</script>

</body>
</html>
