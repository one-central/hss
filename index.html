<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중앙동-성남시 민원문자 010-5920-0184</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background-color: #f5f5f5;
            height: 100vh;
            margin: 0;
        }
        h1 {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 20px;
            width: 100%;
            font-size: 24px;
        }
        a {
            color: inherit;
            text-decoration: none;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            width: 80%;
            max-width: 1200px;
        }
        .postit {
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: transform 0.2s;
            font-size: 16px;
            min-height: 160px;
            display: flex;
            align-items: center;
            background-color: #fff;
            border: 1px solid #eee;
        }
        .postit:hover {
            transform: scale(1.05);
        }
        .postit:active {
            transform: scale(1.09);
        }
        .welfare {
            background-color: #fff9db !important; /* 연한 노란색 */
            border-color: #ffe28b;
        }
        .underground {
            background-color: #e5f7e9 !important; /* 연한 녹색 */
            border-color: #b3e3c0;
        }
        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 20px;
            }
            .postit {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

<h1>[▼더블클릭] 성남시 민원문자 <br> 010-5920-0184</h1>

<div class="container" id="postit-container"></div>

<script>
    // 민원 데이터
    const complaints = [
        {
            type: "welfare", // 복지시설부지
            content: `[복지시설 건립 요청]
중앙동 3002번지 세대를 아우르는 복지시설 건립을 요청합니다.

인근 5,800세대 주민들의 중심지 역할을 하는 공간으로 
 1. 주민들의 요구에 부합하는 시설이 건립되어야 하며,
 2. 다양한 세대 계층이 사용할수 있어야 하며,
 3. 다수의 사람들이 사용 할수 있는 운영을 해야합니다.

중앙동 주민들의 복지 요구에 성남시가 답해야 합니다!!
주민 간담회를 통해 중앙동 주민들의 의견을 수렴해 주시기 바랍니다!!`
        },
        {
            type: "underground", // 전선지중화
            content: `[전선 지중화 주민 민원]
중앙동 하늘채·힐스테이트·해링턴, 제일초 일대는 
도시개발이 진행중인 인구 밀집 지역인데도 전선 지중화가 이루어지지 않아, 
조류에 의한 전신주 변압기 정전사고가 발생하는 지역입니다.

도시개발 당시 전선지중화가 이루워져야함에도
대책없는 개발로 세금이 이중으로 낭비되고, 
주민이 피해보는 정전사고가 발생하고 있습니다.

정전사고로 인하여 공동주택 수천세대의 전기 설비 파손 피해가 반복적으로 발생하고 있습니다.

중앙동 일대 전선지중화를 진행하여 주민 피해를 줄여주시기 바랍니다!`
        },
        {
            type: "welfare", // 복지시설부지
            content: `[성호시장 재개발 요청]
성호시장 재개발이 철거 상태로 장기간 방치되어
도시를 낙후 시키고 쥐과 바퀴벌레의 서식지로 
주민 불편이 지속되고 있습니다.

성호시장이 도심의 폐허로 방치되는 것은 
성남시에서 해결하려는 의지가 약하다고 보여집니다!! 

오랫동안 폐허로 방치되어 도시가 낙후되는 만큼
성남시에서 적극적으로 재개발을 추진해 주시기 바랍니다.`
        },
        {
            type: "welfare", // 복지시설부지
            content: `[중앙동 물놀이 공원 요청]
중앙동은 제일초 인근 아파트의 많은 아이들이 살고 있습니다.

성남시의 자랑인 물놀이 공원은 중앙동에는 하나도 운영되지 않고 있습니다.

물놀이 공원이 운영된다면 주변의 많은 아이들이 이용할수 있는 좋은 복지 시설이 될 것입니다.

성남시에서는 다음과 같이 진행해주시기 바랍니다.
1. 내년 여름에 마을 주변에 이동식 물놀이 시설을 운영해주시기 바랍니다.
2. 장기적으로 중앙동에 물놀이 공원을 설치해 주시기 바랍니다.`
        }
    ];

    // Fisher-Yates 셔플 함수
    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    // 각 그룹 랜덤 + 번갈아 배치
    function alternateMixByTypeAndShuffle(arr) {
        const welfareArr = shuffle(arr.filter(c => c.type === "welfare"));
        const undergroundArr = shuffle(arr.filter(c => c.type === "underground"));
        let i = 0, j = 0, result = [];
        let flag = true; // true = welfare, false = underground

        // 번갈아가며 추가
        while (i < welfareArr.length && j < undergroundArr.length) {
            if (flag) {
                result.push(welfareArr[i++]);
            } else {
                result.push(undergroundArr[j++]);
            }
            flag = !flag;
        }
        // 남은 것 뒤에 추가
        while (i < welfareArr.length) result.push(welfareArr[i++]);
        while (j < undergroundArr.length) result.push(undergroundArr[j++]);
        return result;
    }

    // 화면에 포스트잇 생성 및 기능 부여
    function renderPostIts() {
        const container = document.getElementById('postit-container');
        container.innerHTML = '';
        const postits = alternateMixByTypeAndShuffle(complaints);
        postits.forEach((item) => {
            const div = document.createElement('div');
            div.className = 'postit ' + (item.type === "welfare" ? "welfare" : "underground");
            div.setAttribute('data-content', item.content);
            div.innerText = item.content;

            // 클릭시 복사
            div.addEventListener('click', function() {
                copyToClipboard(item.content);
            });
            // 더블클릭시 SMS
            div.addEventListener('dblclick', function() {
                if (isMobile()) {
                    const smsLink = `sms:01059200184?&body=${encodeURIComponent(item.content)}`;
                    window.location.href = smsLink;
                }
            });
            // 롱터치시 SMS
            div.addEventListener('touchstart', function(e) {
                this.longPressTimer = setTimeout(() => {
                    if (isMobile()) {
                        const smsLink = `sms:01059200184?&body=${encodeURIComponent(item.content)}`;
                        window.location.href = smsLink;
                    }
                }, 800);
            });
            div.addEventListener('touchend', function(e) {
                clearTimeout(this.longPressTimer);
            });

            container.appendChild(div);
        });
    }

    // 모바일 감지
    function isMobile() {
        return /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }
    // 클립보드 복사
    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            // 복사 완료시 추가 동작 X
        }).catch(err => {
            console.error('복사에 실패했습니다.', err);
        });
    }

    window.onload = renderPostIts;
</script>
