<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도환-성남시 민원문자</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background-color: #f5f5f5;
      height: 100vh;
      margin: 0;
    }
    h1 {
      text-align: center;
      margin-top: 40px;
      margin-bottom: 20px;
      width: 100%;
      font-size: 24px;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      width: 80%;
      max-width: 1200px;
    }
    .postit {
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: transform 0.2s ease-in-out;
    }
    .postit:hover {
      transform: scale(1.05);
    }
    .postit:active {
      transform: scale(1.1);
    }
    /* 핑크색: 112로 전송 */
    .pink {
      background-color: #ffcccb;
    }
    /* 하늘색: 010-5920-0184로 전송 */
    .blue {
      background-color: #add8e6;
    }
    @media (max-width: 600px) {
      .container {
        grid-template-columns: 1fr;
      }
      h1 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <h1>[▼더블터치] 분홍 - 112, 하늘색 - 성남시 문자</h1>
  <div class="container" id="postit-container">
    <!-- 여러 내용의 템플릿 포스트잇 (id는 동일하지만 querySelectorAll로 모두 선택) -->
    <div class="postit" id="postit-template" data-content="성남 신흥역 하늘채 1단지 앞에, 아침 5시부터 오후 5시까지 시위 소음으로 일상생활이 힘듭니다!!! 주택가 시위 제한해주세요."></div>
    <div class="postit" id="postit-template" data-content="성남 신흥역 하늘채 1단지. 새벽 5시부터 하루종일 노조 시위로 인한 장송곡 소리가 들려서 정신이 없습니다! 주택가 시위 제한해주세요."></div>
    <div class="postit" id="postit-template" data-content="경기도 성남시 중앙동에 하루 종일 울려퍼지는 노조의 장송곡 소리가 정신건강을 해치고 아이가 경기를 일으키고 있습니다. 즉각 조치 바랍니다."></div>
    <div class="postit" id="postit-template" data-content="성남 신흥역 하늘채 1단지. 하루 종일 장송곡을 들려서 미칠 것 같습니다. 안그래도 사이비교회 때문에 미치겠는데, 완전히 돌아버리겠습니다. 제발좀 주택가 시위좀 제한 해주시기 바랍니다!!"></div>
  </div>

  <script>
    // 모바일 장치 감지 함수
    function isMobile() {
      return /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }

    // SMS 링크 생성 함수 (단일 번호 전송)
    function sendSmsLink(phone, body) {
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var smsLink = "";
      if (/Android/i.test(ua)) {
        // 안드로이드: smsto: 스킴 사용
        smsLink = "smsto:" + phone + "?body=" + encodeURIComponent(body);
      } else {
        // iOS 등: sms: 스킴 사용
        smsLink = "sms:" + phone + "?body=" + encodeURIComponent(body);
      }
      window.location.href = smsLink;
    }

    // 클립보드 복사 함수
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        // 복사 성공 시 처리 (필요시 alert 등 추가 가능)
      }).catch(err => {
        console.error('복사에 실패했습니다.', err);
      });
    }

    // 포스트잇에 이벤트 리스너 추가 (전화번호에 따라)
    function attachPostitEvents(postit, phone) {
      var content = postit.getAttribute('data-content');
      postit.innerHTML = content; // 내용 표시

      // 단일 클릭 시 클립보드 복사
      postit.addEventListener('click', function () {
        copyToClipboard(content);
      });

      // 더블터치 시 SMS 전송 (모바일)
      postit.addEventListener('dblclick', function () {
        if (isMobile()) {
          sendSmsLink(phone, content);
        }
      });

      // 롱터치 (터치 시작) 시 SMS 전송
      postit.addEventListener('touchstart', function () {
        this.longPressTimer = setTimeout(() => {
          if (isMobile()) {
            sendSmsLink(phone, content);
          }
        }, 800);
      });

      postit.addEventListener('touchend', function () {
        clearTimeout(this.longPressTimer);
      });
    }

    // DOM 로드 후, 각 템플릿 포스트잇을 두 개의 포스트잇(핑크, 하늘색)으로 변환
    window.addEventListener('DOMContentLoaded', function() {
      var container = document.getElementById('postit-container');
      // id가 "postit-template"인 모든 템플릿 요소를 선택합니다.
      var templates = Array.from(container.querySelectorAll('#postit-template'));
      
      templates.forEach(function(template) {
        var content = template.getAttribute('data-content');
        // 템플릿 제거
        container.removeChild(template);
        
        // 핑크색 포스트잇 생성 (112 전송)
        var pinkPostit = document.createElement('div');
        pinkPostit.className = 'postit pink';
        pinkPostit.setAttribute('data-content', content);
        container.appendChild(pinkPostit);
        attachPostitEvents(pinkPostit, "112");
        
        // 하늘색 포스트잇 생성 (01059200184 전송)
        var bluePostit = document.createElement('div');
        bluePostit.className = 'postit blue';
        bluePostit.setAttribute('data-content', content);
        container.appendChild(bluePostit);
        attachPostitEvents(bluePostit, "01059200184");
      });

      // (선택 사항) 모든 생성된 포스트잇의 순서를 랜덤하게 섞기
      var postits = Array.from(container.children);
      var shuffled = postits.sort(() => Math.random() - 0.5);
      container.innerHTML = '';
      shuffled.forEach(function(postit) {
        container.appendChild(postit);
      });
    });
  </script>

  <br>
  <a href="https://hits.sh/one-central.github.io/hss/">
    <img alt="Hits" src="https://hits.sh/one-central.github.io/hss.svg?style=flat-square&label=access&color=d2d2d2"/>
  </a>
</body>
</html>
